<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HDF DLV Plan</title>
<meta name="description" content="HDF – Honor Duty Family: DLV Level 28 plan for Total War">
<style>
:root{
  --bg:#0b1624; --card:#12243a; --card2:#173050; --line:#24426a;
  --text:#eaf1fa; --muted:#9db2cc; --accent:#f5b83d;
  --red:#e0524f; --redbg:#3a1a1f; --green:#2fbf71; --greenbg:#123526;
  --warn:#f5b83d; --warnbg:#3a2e12;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{text-align:center;padding:8px 0 4px}
.badge{display:inline-block;font-weight:700;letter-spacing:.12em;color:var(--accent);font-size:13px}
h1{margin:4px 0 2px;font-size:26px;line-height:1.2}
.sub{color:var(--muted);font-size:14px;margin:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.bar label{flex:1 1 200px;display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
select,input{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.clock{font-size:13px;color:var(--muted);text-align:center;margin-top:-4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.card h2{margin:0 0 8px;font-size:19px}
.card p{margin:6px 0}
.now{text-align:center;border-width:2px}
.now .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.now .msg{font-size:21px;font-weight:800;margin:6px 0 10px}
.now.red{background:var(--redbg);border-color:var(--red)}
.now.green{background:var(--greenbg);border-color:var(--green)}
.now.warn{background:var(--warnbg);border-color:var(--warn)}
.cd{display:flex;justify-content:center;gap:8px;margin:8px 0 2px}
.cd div{background:rgba(0,0,0,.25);border-radius:10px;padding:6px 4px;flex:1 1 0;min-width:0;max-width:80px}
.cd b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.cd span{font-size:11px;color:var(--muted)}
.cdl{font-size:14px;color:var(--muted)}
.cdt{font-size:13px;color:var(--muted);margin-top:4px}
ul.check{list-style:none;padding:0;margin:0}
ul.check li{padding:8px 0 8px 34px;position:relative;border-bottom:1px solid var(--line)}
ul.check li:last-child{border:0}
ul.check li::before{content:"✔";position:absolute;inset-inline-start:4px;top:7px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#06220f;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:900}
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.goals div{background:var(--card2);border-radius:10px;padding:10px 6px;overflow-wrap:anywhere;hyphens:auto;text-align:center;font-size:13px;color:var(--muted)}
.goals b{display:block;font-size:20px;color:var(--text)}
.big{font-weight:800}
.warnbox{background:var(--warnbg);border:1px solid var(--warn);border-radius:10px;padding:10px;font-size:14px;margin:8px 0}
.redbox{background:var(--redbg);border:1px solid var(--red);border-radius:10px;padding:10px;margin:8px 0}
.greenbox{background:var(--greenbg);border:1px solid var(--green);border-radius:10px;padding:10px;margin:8px 0}
.when{display:block;font-weight:700;margin-top:4px}
table.tl{width:100%;border-collapse:separate;border-spacing:4px;font-size:13px;margin-top:6px}
table.tl th{color:var(--muted);font-weight:600;text-align:start;padding:2px 4px}
table.tl td{border-radius:8px;padding:6px;vertical-align:top}
td.rn{background:var(--card2);font-weight:700;white-space:nowrap}
td.lose{background:var(--redbg);border:1px solid var(--red)}
td.win{background:var(--greenbg);border:1px solid var(--green)}
td.mix{background:linear-gradient(90deg,var(--redbg) 0 55%,var(--greenbg) 55% 100%);border:1px solid var(--green)}
td.cur{outline:3px solid var(--accent);outline-offset:1px}
td small{display:block;color:var(--muted);font-size:11px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-inline-end:6px}
.st{display:block;margin-top:6px;font-weight:700;font-size:12px;color:var(--warn)}
.st.ok{color:var(--green)}
ul.check li.done{text-decoration:line-through;opacity:.55}
.foot{color:var(--muted);font-size:12px;text-align:center;margin:20px 0}
#miss{display:none}
#miss .row{display:flex;flex-direction:column;gap:8px;margin-top:8px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px;background:var(--accent);color:#2a1d00;cursor:pointer}
button:disabled{opacity:.6}
.ok{color:var(--green)}.err{color:var(--red)}
@media (max-width:480px){h1{font-size:22px}.goals b{font-size:17px}.cd{gap:5px}.cd b{font-size:22px}table.tl{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="badge">HDF · HONOR DUTY FAMILY</div>

  <p class="sub">Battle Warship · Total War · DLV 28</p>

<div class="clock" id="clock"></div>

<div class="card" id="miss">

    <div id="missRes"></div>
  </div>

<div class="card now" id="now">
  <div class="lbl" data-t="now"></div>
  <div class="msg" id="nowMsg"></div>
  <div class="cdl" id="cdLbl"></div>
  <div class="cd" id="cd"></div>
  <div class="cdt" id="cdAt"></div>

  <div class="cdt" id="cd3At"></div>

    <li data-t="task1"></li>
    <li data-t="task2" data-m="donations"></li>
    <li data-t="task3" data-m="rallies"></li>
  </ul>
</div>

<div class="card">
  <h2>🎯 <span data-t="goalH"></span></h2>
  <p data-t="goalP"></p>
  <div class="goals">
    <div><b>2,168</b><span data-t="goal1"></span><small class="st" data-ms="tw"></small></div>
    <div><b>1,800</b><span data-t="goal2"></span><small class="st" data-ms="rallies"></small></div>
    <div><b>79,800</b><span data-t="goal3"></span><small class="st" data-ms="donations"></small></div>
  </div>
  <p data-t="missStay"></p>
</div>

<div class="card">
  <h2>📝 <span data-t="signH"></span></h2>
  <p class="big" data-t="sign1"></p>
  <p data-t="sign2"></p>
  <div class="warnbox"><span data-t="signEnd"></span> <span class="when" id="signWhen"></span></div>
</div>

<div class="card">
  <h2>⚔️ <span data-t="twH"></span></h2>
  <p data-t="tw1"></p>
  <p data-t="tw2"></p>
  <table class="tl" id="tl"></table>
  <div class="legend">
    <span><i style="background:var(--red)"></i><span data-t="legLose"></span></span>
    <span><i style="background:var(--green)"></i><span data-t="legWin"></span></span>
  </div>
  <div class="warnbox" id="unsure">⚠️ <span data-t="unsure"></span></div>
</div>

<div class="card">
  <h2>🗺️ <span data-t="planH"></span></h2>
  <div class="redbox">
    <p class="big">🛑 <span data-t="plan1"></span></p>
    <p data-t="plan2"></p>
    <p class="big" data-t="plan3"></p>
    <p data-t="defNote"></p>
  </div>
  <div class="greenbox">
    <p class="big">⏰ <span data-t="winH"></span></p>
    <span class="when" id="winWhen"></span>
    <p data-t="win1"></p>
    <p data-t="win2"></p>
    <p class="big" data-t="win3"></p>
  </div>
  <div class="greenbox">
    <p class="big">🚀 <span data-t="r5H"></span></p>
    <p data-t="r5a"></p>
    <p data-t="r5c"></p>
    <p><span data-t="r5b"></span> <span class="when" id="dlvWhen"></span></p>
  </div>
</div>

<div class="card">
  <h2>☄️ <span data-t="donH"></span></h2>
  <p class="big" data-t="don1"></p>
  <p data-t="don2"></p>
  <p data-t="don3"></p>
</div>

<div class="card">
  <h2>🚩 <span data-t="ralH"></span></h2>
  <ul class="check">
    <li class="big" data-t="ral1"></li>
    <li data-t="ral2"></li>
    <li data-t="ral3"></li>
    <li data-t="ral4"></li>
    <li data-t="ral5"></li>
    <li data-t="ral6"></li>
  </ul>
</div>

<div class="card">
  <h2>🤝 <span data-t="fairH"></span></h2>
  <p class="big" data-t="fair1"></p>
  <p data-t="fair2"></p>
  <p data-t="fair3"></p>
  <p data-t="fairChk"></p>
  <p class="big" data-t="fairAway"></p>
  <p data-t="fair4"></p>
  <p class="big" data-t="fair5"></p>
  <p data-t="contact"></p>
</div>

<div class="foot"><span data-t="upd"></span> <span id="upd"></span><br>HDF · Honor Duty Family</div>
</div>

const RTL = ["ar","fa","ur","he"];
const DAY = 864e5;
const $ = id => document.getElementById(id);
let L = "en", TZ = "UTC";
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const rn = n => { const r=t("r"); return r.includes("{n}")?r.replace("{n}",n):r+" "+n; };
const t = k => (I18N[L] && I18N[L][k]) || I18N.en[k] || "";

function fight(r,f){ const s = CFG.seasonStart + r*7*DAY + f*DAY; return {s, e:s+DAY}; }

function fmt(ts, withGame=true){
  const loc = L==="zh-Hans"?"zh-CN":L==="zh-Hant"?"zh-TW":L==="fil"?"fil-PH":L;
  let a;
  try{ a = new Intl.DateTimeFormat(loc,{timeZone:TZ,weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(ts); }
  catch(e){ a = new Date(ts).toUTCString(); }
  if(!withGame || TZ==="UTC") return a + (TZ==="UTC" ? " ("+t("tzGame")+")" : "");
  const g = new Intl.DateTimeFormat(loc,{timeZone:"UTC",hour:"2-digit",minute:"2-digit"}).format(ts);
  return a + " · " + t("game") + " " + g;
}
function fmtShort(ts){
  const loc = L==="zh-Hans"?"zh-CN":L==="zh-Hant"?"zh-TW":L==="fil"?"fil-PH":L;
  try{ return new Intl.DateTimeFormat(loc,{timeZone:TZ,weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(ts); }
  catch(e){ return new Date(ts).toUTCString(); }
}

function buildLang(){
  const sel = $("lang"); sel.innerHTML = "";
  Object.keys(I18N).forEach(k=>{ const o=document.createElement("option"); o.value=k; o.textContent=I18N[k].name; sel.appendChild(o); });
  const o=document.createElement("option"); o.value="__miss"; o.textContent="❓ Language not found?"; sel.appendChild(o);
}
function pickLang(){
  const saved = store.get("lang"); if(saved && I18N[saved]) return saved;
  for(const n of (navigator.languages||[navigator.language||"en"])){
    const l=n.toLowerCase();
    if(l.startsWith("zh")) return (/tw|hk|mo|hant/.test(l))?"zh-Hant":"zh-Hans";
    if(l.startsWith("tl")||l.startsWith("fil")) return "fil";
    if(l==="nb"||l.startsWith("nb")||l.startsWith("nn")) { if(I18N.no) return "no"; }
    const b=l.split("-")[0]; if(I18N[b]) return b;
  }
  return "en";
}

  add("Europe/Berlin","🇩🇪 "+t("tzDe"));
  if(mine!=="UTC"&&mine!=="Europe/Berlin") add(mine,"📍 "+mine.replace(/_/g," "));
  let all=[]; try{ all=Intl.supportedValuesOf("timeZone"); }catch(e){ all=["America/Los_Angeles","America/New_York","America/Sao_Paulo","Europe/London","Europe/Paris","Europe/Moscow","Africa/Lagos","Africa/Johannesburg","Asia/Dubai","Asia/Kolkata","Asia/Bangkok","Asia/Jakarta","Asia/Shanghai","Asia/Manila","Asia/Tokyo","Asia/Seoul","Australia/Sydney","Pacific/Auckland"]; }
  const g=document.createElement("optgroup"); g.label="—"; all.forEach(z=>add(z,z.replace(/_/g," "),g)); sel.appendChild(g);
  const saved=store.get("tz"); TZ = saved || mine;
  sel.value=TZ; if(sel.value!==TZ){ TZ="UTC"; sel.value="UTC"; }
}

function applyText(){
  document.documentElement.lang=L;
  document.documentElement.dir=RTL.includes(L)?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll("[data-tp]").forEach(el=>el.placeholder=t(el.dataset.tp));
  $("signWhen").textContent=fmt(CFG.signupEnd);
  $("winWhen").textContent=fmt(CFG.windowStart)+"  →  "+fmtShort(CFG.windowEnd);
  $("dlvWhen").textContent=fmt(CFG.dlvEnd);
  $("upd").textContent=fmt(CFG.updated,false);
  $("unsure").style.display=CFG.startConfirmed?"none":"";
  document.querySelectorAll("[data-ms]").forEach(el=>{const d=CFG.missions[el.dataset.ms]; el.textContent=d?t("done"):"⏳ "+t("open"); el.classList.toggle("ok",!!d);});
  document.querySelectorAll("li[data-m]").forEach(el=>el.classList.toggle("done",!!CFG.missions[el.dataset.m]));
  buildTimeline(); tick();
}

function buildTimeline(){
  const tb=$("tl"); const now=Date.now();
  let h="<tr><th></th><th>"+t("f1")+"</th><th>"+t("f2")+"</th><th>"+t("f3")+"</th></tr>";
  for(let r=0;r<5;r++){
    h+="<tr><td class='rn'>"+rn(r+1)+"</td>";
    for(let f=0;f<3;f++){
      const x=fight(r,f); let cls=r<4?"lose":"win";
      if(r===3&&f===2) cls="mix";
      if(now>=x.s&&now<x.e) cls+=" cur";
      let extra="";
      if(r===3&&f===2) extra="<small>✅ "+fmtShort(CFG.windowStart)+"</small>";
      h+="<td class='"+cls+"'>"+(r<4&&!(r===3&&f===2)?"🛑":"⚔️")+" "+fmtShort(x.s)+extra+"</td>";
    }
    h+="</tr>";
  }
  tb.innerHTML=h;
}

function renderCd(el,target){
  let ms=Math.max(0,target-Date.now()); const d=Math.floor(ms/DAY); ms-=d*DAY;
  const hh=Math.floor(ms/36e5); ms-=hh*36e5; const mm=Math.floor(ms/6e4); const ss=Math.floor((ms-mm*6e4)/1e3);
  const p=n=>String(n).padStart(2,"0");
  el.innerHTML="<div><b>"+d+"</b><span>"+t("d")+"</span></div><div><b>"+p(hh)+"</b><span>"+t("h")+"</span></div><div><b>"+p(mm)+"</b><span>"+t("m")+"</span></div><div><b>"+p(ss)+"</b><span>"+t("s")+"</span></div>";
}

function phase(now){
  const S=CFG.seasonStart, r5=fight(4,0).s;
  if(now<CFG.signupEnd) return {c:"warn",m:"phPre",l:"cdSignup",to:CFG.signupEnd};
  if(now<S) return {c:"warn",m:"phPause",l:"cdNextRound",to:S};
  for(let r=0;r<4;r++){
    for(let f=0;f<3;f++){
      const x=fight(r,f);
      if(now>=x.s&&now<x.e){
        if(r===3&&f===2){
          if(now<CFG.windowStart) return {c:"red",m:"phWait",l:"cdWindow",to:CFG.windowStart};
          if(now<CFG.windowEnd) return {c:"green",m:"phWindow",l:"cdWindowEnd",to:CFG.windowEnd};
        }
        if(r===3) return {c:"red",m:"phLose",l:"cdWindow",to:CFG.windowStart,round:r+1};
        return {c:"red",m:"phLose",l:"cdNextRound",to:fight(r+1,0).s,round:r+1};
      }
    }
    const e=fight(r,2).e, n=fight(r+1,0).s;
    if(now>=e&&now<n) return {c:r===3?"green":"warn",m:r===3?"phPause5":"phPause",l:r===3?"cdR5":"cdNextRound",to:n};
  }
  if(now>=r5&&now<CFG.dlvEnd) return {c:"green",m:"phGo",l:"cdDlv",to:CFG.dlvEnd};
  return {c:"green",m:"phDone"};
}

let lastCur="";
function tick(){
  const now=Date.now(), p=phase(now);
  $("now").className="card now "+p.c;
  $("nowMsg").textContent=(p.round?rn(p.round)+": ":"")+t(p.m);
  if(p.to){ $("cdLbl").textContent=t(p.l); renderCd($("cd"),p.to); $("cdAt").textContent=fmt(p.to); $("cd").style.display=""; }
  else { $("cdLbl").textContent=""; $("cd").style.display="none"; $("cdAt").textContent=""; }
  if(now<CFG.dlvStart){ $("dlvCard").style.display=""; renderCd($("cd3"),CFG.dlvStart); $("cd3At").textContent=fmt(CFG.dlvStart); } else $("dlvCard").style.display="none";
  let cl; try{ cl=new Intl.DateTimeFormat("en-GB",{timeZone:"UTC",hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(now); }catch(e){cl="";}
  $("clock").textContent="⚓ "+t("tzGame")+": "+cl;
  const cur=Math.floor((now-CFG.seasonStart)/DAY); if(String(cur)!==lastCur){ lastCur=String(cur); buildTimeline(); }
}

function init(){
  buildLang(); L=pickLang(); $("lang").value=L; buildTz(); applyText();
  $("lang").addEventListener("change",e=>{
    if(e.target.value==="__miss"){ $("miss").style.display="block"; $("lang").value=L; L="en"; applyText(); $("lang").value="en"; $("miss").scrollIntoView({behavior:"smooth"}); return; }
    L=e.target.value; store.set("lang",L); const z=$("tz").value; buildTz(); $("tz").value=z; TZ=z; applyText();
  });
  $("tz").addEventListener("change",e=>{ TZ=e.target.value; store.set("tz",TZ); applyText(); });
  $("missBtn").addEventListener("click",async()=>{
    const lang=$("missLang").value.trim(), name=$("missName").value.trim(); const res=$("missRes");
    if(!lang){ $("missLang").focus(); return; }
    $("missBtn").disabled=true;
    try{
      const r=await fetch(CFG.ntfy,{method:"POST",headers:{"Title":"HDF page: language missing","Tags":"globe_with_meridians"},body:"Language: "+lang+(name?"\nPlayer: "+name:"")+"\nBrowser: "+(navigator.language||"?")});
      if(!r.ok) throw 0; res.className="ok"; res.textContent=t("missOk"); $("missLang").value=""; $("missName").value="";
    }catch(err){ res.className="err"; res.textContent=t("missErr"); }
    $("missBtn").disabled=false;
  });
  setInterval(tick,1000);
}
init();
</script>
